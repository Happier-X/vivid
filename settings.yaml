apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-vite-starter-setting
spec:
  forms:
    # ---------- 样式 ----------
    - group: style
      label: 样式
      formSchema:
        - $formkit: color
          name: primary_color
          label: 品牌主色
          value: "#4fc7b7"
          help: 用于按钮、链接、强调元素等品牌色场景
        - $formkit: color
          name: secondary_color
          label: 辅助色
          value: "#ffd86b"
          help: 用于标题、深色区块等辅助色场景
        - $formkit: radio
          name: radius_style
          label: 圆角风格
          value: rounded
          options:
            - label: 圆润（大圆角）
              value: rounded
            - label: 硬朗（直角）
              value: sharp
