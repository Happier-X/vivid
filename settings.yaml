apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-vite-starter-setting
spec:
  forms:
    # ---------- 样式 ----------
    - group: style
      label: 样式
      formSchema:
        - $formkit: color
          name: primary_color
          label: 品牌主色
          value: "#4fc7b7"
          help: 用于按钮、链接、强调元素等品牌色场景
        - $formkit: color
          name: secondary_color
          label: 辅助色
          value: "#ffd86b"
          help: 用于标题、深色区块等辅助色场景
        - $formkit: radio
          name: radius_style
          label: 圆角风格
          value: rounded
          options:
            - label: 圆润（大圆角）
              value: rounded
            - label: 硬朗（直角）
              value: sharp
    # ---------- 合作咨询表单 ----------
    - group: cooperation
      label: 合作咨询表单
      formSchema:
        - $formkit: text
          name: endpoint
          label: 表单提交接口
          value: "/apis/api.cooperation.vivid.run/v1alpha1/cooperations"
          help: "合作表单提交接口地址，同源插件路径为 /apis/api.cooperation.vivid.run/v1alpha1/cooperations，留空则表单仅展示联系方式提示"
        - $formkit: text
          name: receiver_email
          label: 接收邮箱（备用 mailto）
          value: "contact@wanchunsmart.com"
          help: "未配置接口时的备用联系邮箱，用于 mailto 链接"
        - $formkit: text
          name: success_title
          label: 提交成功标题
          value: "提交成功"
          help: "表单提交成功后展示的标题"
        - $formkit: textarea
          name: success_desc
          label: 提交成功描述
          value: "我们已收到您的合作意向，商务团队将在 24 小时内与您联系。"
          help: "表单提交成功后展示的描述文案"
