apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-vite-starter-setting
spec:
  forms:
    # ---------- 样式 ----------
    - group: style
      label: 样式
      formSchema:
        - $formkit: color
          name: primary_color
          label: 品牌主色
          value: "#4fc7b7"
          help: 用于按钮、链接、强调元素等品牌色场景
        - $formkit: color
          name: secondary_color
          label: 辅助色
          value: "#ffd86b"
          help: 用于标题、深色区块等辅助色场景
        - $formkit: radio
          name: radius_style
          label: 圆角风格
          value: rounded
          options:
            - label: 圆润（大圆角）
              value: rounded
            - label: 硬朗（直角）
              value: sharp

    # ---------- Hero 首屏 ----------
    - group: hero
      label: Hero 首屏
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: text
          name: badge
          label: 顶部标签
          value: "新一代智能科技"
        - $formkit: text
          name: title
          label: 主标题
          value: "以科技创新，驱动企业未来"
        - $formkit: textarea
          name: subtitle
          label: 副标题
          value: "我们专注于为企业提供智能化产品与解决方案，让技术更好地服务于每一个人。"
        - $formkit: text
          name: primary_button_text
          label: 主按钮文字
          value: "立即体验"
        - $formkit: url
          name: primary_button_link
          label: 主按钮链接
          value: "/archives"
        - $formkit: text
          name: secondary_button_text
          label: 次按钮文字
          value: "了解更多"
        - $formkit: url
          name: secondary_button_link
          label: 次按钮链接
          value: "/about"
        - $formkit: list
          name: highlights
          label: 特性标签
          value:
            - "智能互联"
            - "极致性能"
            - "安全可靠"
          help: 显示在首屏下方的特性标签组
        - $formkit: attachment
          name: image
          label: 主图
          help: 建议上传宽幅产品图或品牌形象图

    # ---------- 核心特性 ----------
    - group: features
      label: 核心特性
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: text
          name: eyebrow
          label: 小标题
          value: "核心优势"
        - $formkit: text
          name: title
          label: 大标题
          value: "核心科技，重新定义体验"
        - $formkit: attachment
          name: image
          label: 配图
          help: 可选，显示在特性卡片一侧的形象图
        - $formkit: array
          name: items
          label: 特性条目
          value:
            - title: "自主研发"
              description: "核心技术全栈自研，持续迭代升级，保障产品长期竞争力。"
            - title: "智能算法"
              description: "基于深度学习的智能算法引擎，让设备更懂你的需求。"
            - title: "极速响应"
              description: "毫秒级响应速度，流畅体验贯穿每一个操作细节。"
            - title: "安全守护"
              description: "多重加密与隐私保护机制，全方位守护用户数据安全。"
          children:
            - $formkit: text
              name: title
              label: 标题
            - $formkit: textarea
              name: description
              label: 描述

    # ---------- 精选产品 ----------
    - group: products
      label: 精选产品
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: text
          name: eyebrow
          label: 小标题
          value: "精选推荐"
        - $formkit: text
          name: title
          label: 大标题
          value: "精选产品"
        - $formkit: categorySelect
          name: category
          label: 来源分类
          help: 选择一个文章分类作为产品来源；不选则显示最新文章
        - $formkit: number
          name: count
          label: 展示数量
          value: 4
          min: 1
          max: 12
        - $formkit: switch
          name: show_more
          label: 显示"查看全部"链接
          value: true
        - $formkit: url
          name: more_link
          label: 查看全部链接
          value: "/categories"

    # ---------- 功能介绍 ----------
    - group: intro
      label: 功能介绍
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: text
          name: eyebrow
          label: 小标题
          value: "功能亮点"
        - $formkit: text
          name: title
          label: 大标题
          value: "智能互联，一切尽在掌控"
        - $formkit: textarea
          name: description
          label: 描述
          value: "通过专属应用，随时掌握设备状态，远程操控触手可及，让智能融入生活的每个角落。"
        - $formkit: attachment
          name: image
          label: 配图
        - $formkit: array
          name: points
          label: 功能点
          value:
            - title: "APP 智能互联"
              description: "手机与设备无缝连接，随时随地远程管理。"
            - title: "个性化设置"
              description: "丰富自定义选项，打造专属于你的使用习惯。"
          children:
            - $formkit: text
              name: title
              label: 标题
            - $formkit: textarea
              name: description
              label: 描述

    # ---------- CTA 横幅 ----------
    - group: cta
      label: CTA 横幅
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: text
          name: title
          label: 标题
          value: "准备好开启智能新生活了吗？"
        - $formkit: textarea
          name: description
          label: 描述
          value: "立即加入我们，探索更多可能，让科技为你的业务赋能。"
        - $formkit: text
          name: primary_button_text
          label: 主按钮文字
          value: "联系我们"
        - $formkit: url
          name: primary_button_link
          label: 主按钮链接
          value: "/contact"
        - $formkit: text
          name: secondary_button_text
          label: 次按钮文字
          value: "查看方案"
        - $formkit: url
          name: secondary_button_link
          label: 次按钮链接
          value: "/archives"

    # ---------- 数据统计 ----------
    - group: stats
      label: 数据统计
      formSchema:
        - $formkit: switch
          name: enabled
          label: 显示该区块
          value: true
        - $formkit: array
          name: items
          label: 统计项
          value:
            - value: "500万+"
              label: 全球用户
            - value: "30+"
              label: 覆盖国家与地区
            - value: "99.9%"
              label: 服务可用性
            - value: "24/7"
              label: 全天候支持
          children:
            - $formkit: text
              name: value
              label: 数值
            - $formkit: text
              name: label
              label: 说明文字

    # ---------- 页脚 ----------
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: copyright
          label: 版权文本
          value: "© 2025 你的公司名称. 保留所有权利."
        - $formkit: text
          name: icp
          label: 备案号
          help: 留空则不显示
        - $formkit: list
          name: links
          label: 附加链接
          help: 每行一条，格式：链接地址|显示文字，例如 /about|关于我们
