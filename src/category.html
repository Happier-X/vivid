<include src="layout.html">
  <template name="head">
    <title th:text="|${category.spec.displayName} - ${site.title}|">Category Archive</title>
  </template>

  <!-- 页头横幅 -->
  <header class="section-tinted border-line/70 border-b">
    <div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-20 lg:px-8">
      <p class="text-primary-dark text-sm font-semibold tracking-[0.2em] uppercase">分类专栏</p>
      <span class="bg-primary mt-3 block h-0.5 w-6 rounded-full"></span>
      <h1
        class="text-ink-900 mt-5 mb-3 text-3xl leading-tight font-black tracking-tighter sm:text-4xl"
        th:text="|${category.spec.displayName}|"
      ></h1>
      <p
        th:if="${not #strings.isEmpty(category.spec.description)}"
        th:text="${category.spec.description}"
        class="text-ink-500/90 max-w-2xl leading-7 font-light"
      ></p>
    </div>
  </header>

  <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
    <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-4">
      <th:block th:each="post : ${posts.items}">
        <include src="post-card.html"></include>
      </th:block>
    </div>

    <include src="pagination.html"></include>
  </div>
</include>
