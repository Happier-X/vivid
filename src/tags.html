<include src="layout.html">
  <template name="head">
    <title th:text="|标签 - ${site.title}|">标签</title>
  </template>

  <!-- 页头横幅 -->
  <header class="section-tinted border-line/70 border-b">
    <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-16 lg:px-8">
      <p class="text-primary mb-3 text-sm font-semibold tracking-widest uppercase">内容导航</p>
      <h1 class="text-ink-900 text-3xl font-extrabold tracking-tight sm:text-4xl">全部标签</h1>
      <p class="text-ink-500 mt-3 text-base">按标签快速定位感兴趣的内容</p>
    </div>
  </header>

  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <!-- 标签云 -->
    <div class="flex flex-wrap gap-3" th:if="${not #lists.isEmpty(tags.items)}">
      <a
        th:each="tag : ${tags.items}"
        th:href="@{${tag.status.permalink}}"
        class="hover:border-primary hover:bg-mist hover:text-primary-dark border-line text-ink-700 shadow-soft inline-flex items-center gap-1.5 rounded-full border bg-white px-5 py-2.5 text-sm font-medium transition-colors duration-200"
      >
        <span class="bg-primary inline-block h-1.5 w-1.5 rounded-full"></span>
        <span th:text="${tag.spec.displayName}">标签名称</span>
      </a>
    </div>

    <!-- 空状态 -->
    <div
      th:if="${#lists.isEmpty(tags.items)}"
      class="text-ink-500 border-line rounded-[var(--radius-card)] border border-dashed py-20 text-center text-sm"
    >
      暂无标签，请在后台为文章添加标签
    </div>

    <!-- 分页 -->
    <nav
      class="mt-12 flex items-center justify-center gap-3"
      th:if="${tags.hasPrevious() || tags.hasNext()}"
      aria-label="标签分页"
    >
      <a
        th:if="${tags.hasPrevious()}"
        th:href="@{${tags.prevUrl}}"
        class="text-ink-700 hover:border-primary hover:text-primary hover:shadow-soft border-line inline-flex h-10 items-center rounded-full border bg-white px-5 text-sm font-medium transition-all duration-200"
        >上一页</a
      >
      <span class="text-ink-500 text-sm" th:text="|第 ${tags.page} / ${tags.totalPages} 页|"
        >第 1 / 1 页</span
      >
      <a
        th:if="${tags.hasNext()}"
        th:href="@{${tags.nextUrl}}"
        class="text-ink-700 hover:border-primary hover:text-primary hover:shadow-soft border-line inline-flex h-10 items-center rounded-full border bg-white px-5 text-sm font-medium transition-all duration-200"
        >下一页</a
      >
    </nav>
  </div>
</include>
