<!-- 文章卡片（企业风格）：封面 + 分类徽标 + 标题 + 摘要 -->
<!-- 使用方式：外层自行包裹 th:each="post : ${...}" 循环 -->
<article
  class="card-hover group border-line shadow-soft flex flex-col overflow-hidden rounded-[var(--radius-card)] border bg-white"
>
  <!-- 封面图：无封面时显示品牌渐变占位 -->
  <a th:href="@{${post.status.permalink}}" class="bg-mist block aspect-video overflow-hidden">
    <img
      th:if="${not #strings.isEmpty(post.spec.cover)}"
      th:src="${post.spec.cover}"
      th:alt="${post.spec.title}"
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
    />
    <div
      th:unless="${not #strings.isEmpty(post.spec.cover)}"
      class="from-mist via-primary/20 to-primary/40 flex h-full w-full items-center justify-center bg-gradient-to-br"
    >
      <svg
        class="text-primary/60 h-12 w-12"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M18 6h.008v.008H18V6z"
        />
      </svg>
    </div>
  </a>

  <div class="flex flex-1 flex-col gap-3 p-6">
    <!-- 分类徽标 + 发布时间 -->
    <div class="text-ink-500 flex items-center gap-3 text-xs">
      <th:block th:if="${not #lists.isEmpty(post.categories)}">
        <span
          class="bg-mist text-primary-dark rounded-full px-3 py-1 font-semibold"
          th:text="${post.categories[0].spec.displayName}"
        ></span>
      </th:block>
      <time
        th:if="${post.spec.publishTime != null}"
        th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"
      ></time>
    </div>

    <!-- 标题 -->
    <h3
      class="text-ink-900 group-hover:text-primary leading-snug font-extrabold tracking-tight transition-colors duration-200"
    >
      <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}" class="line-clamp-2"
        >文章标题</a
      >
    </h3>

    <!-- 摘要 -->
    <p th:text="${post.status.excerpt}" class="text-ink-500 line-clamp-3 text-sm leading-relaxed">
      文章摘要
    </p>
  </div>
</article>
