<!-- CTA 横幅 + 数据统计栏（参考站合并区块） -->
<section
  class="relative overflow-hidden py-20 sm:py-24"
  style="background: linear-gradient(145deg, #2b8d89, #4fc7b7)"
>
  <!-- 装饰性光斑 -->
  <div
    class="pointer-events-none absolute -top-32 -left-32 h-80 w-80 rounded-full bg-white/8 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -right-32 -bottom-32 h-80 w-80 rounded-full bg-secondary/10 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 text-center">
    <div class="reveal flex flex-col items-center gap-8">
      <h2
        th:text="${theme.config.cta?.title}"
        class="text-3xl font-black tracking-tight text-white sm:text-4xl"
      >
        标题
      </h2>
      <p
        th:if="${not #strings.isEmpty(theme.config.cta?.description)}"
        th:text="${theme.config.cta.description}"
        class="text-base leading-relaxed text-white/85 sm:text-lg"
      >
        描述
      </p>

      <!-- 双按钮 -->
      <div class="flex flex-wrap items-center justify-center gap-4">
        <a
          th:if="${not #strings.isEmpty(theme.config.cta?.primary_button_text)}"
          th:href="@{${theme.config.cta.primary_button_link ?: '#'}}"
          th:text="${theme.config.cta.primary_button_text}"
          class="btn btn-white"
        >主按钮</a>
        <a
          th:if="${not #strings.isEmpty(theme.config.cta?.secondary_button_text)}"
          th:href="@{${theme.config.cta.secondary_button_link ?: '#'}}"
          th:text="${theme.config.cta.secondary_button_text}"
          class="btn btn-ghost"
        >次按钮</a>
      </div>
    </div>

    <!-- 统计数字（按钮下方，同区块内） -->
    <div
      th:if="${not #lists.isEmpty(theme.config.stats?.items)}"
      class="reveal mt-14 grid grid-cols-2 gap-x-6 gap-y-8 sm:mt-16 lg:grid-cols-4"
    >
      <div
        th:each="item : ${theme.config.stats.items}"
        class="flex flex-col items-center gap-2 text-center"
      >
        <span
          th:text="${item.value}"
          class="text-4xl font-black tracking-tight text-white tabular-nums sm:text-5xl"
        >500万+</span>
        <span
          th:text="${item.label}"
          class="inline-flex items-center rounded-full bg-white/15 px-4 py-1 text-sm font-medium text-white/90"
        >说明文字</span>
      </div>
    </div>
  </div>
</section>
