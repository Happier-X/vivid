<!-- 底部 CTA + 统计：1:1 复刻 mikapu 底部横幅，内容保留万椿 -->
<section
  class="relative overflow-hidden"
  style="background: linear-gradient(145deg, #2b8d89, #4fc7b7)"
>
  <!-- 极淡网格纹理 -->
  <div
    class="pointer-events-none absolute inset-0 opacity-[0.12]"
    style="
      background-image: radial-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px);
      background-size: 16px 16px;
    "
    aria-hidden="true"
  ></div>

  <div class="relative mx-auto w-[calc(100%-32px)] max-w-[1180px] px-0 py-[88px] text-center">
    <div class="reveal flex flex-col items-center">
      <h2
        class="text-[clamp(30px,4vw,48px)] leading-[1.15] font-black tracking-tight text-white"
        style="font-weight: 900"
      >
        共建有温度的智慧养老生态
      </h2>
      <p class="mt-4 max-w-[680px] text-[18px] leading-7 text-white/85">
        10 年+ 深耕 · 3 大研发中心 · 200+ 核心专利，2 亿+ 智造积累，携手 150+
        国家和地区的伙伴，让科技更有温度。
      </p>
      <!-- 双按钮：白底实 + 透明描边，与截图一致 8px 圆角 -->
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3.5">
        <a
          th:href="@{/page/about}"
          href="/page/about"
          class="inline-flex min-h-[44px] items-center justify-center rounded-[8px] bg-white px-6 py-2.5 text-sm font-extrabold text-[#2b8d89] shadow-[0_8px_24px_rgba(0,0,0,0.12)] transition-all duration-200 hover:-translate-y-0.5"
          >预约演示</a
        >
        <a
          th:href="@{/page/cooperation}"
          href="/page/cooperation"
          class="inline-flex min-h-[44px] items-center justify-center rounded-[8px] border border-white/40 bg-white/10 px-6 py-2.5 text-sm font-extrabold text-white backdrop-blur-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-white hover:bg-white/15"
          >成为合作伙伴</a
        >
      </div>
    </div>

    <!-- 统计：裸大数字 + 半透标签，与截图 500万+ 布局一致 -->
    <div class="reveal mt-14 grid grid-cols-2 gap-8 lg:grid-cols-4">
      <div class="flex flex-col items-center text-center">
        <strong
          class="text-[clamp(34px,4vw,52px)] leading-none font-black tracking-tight text-white tabular-nums"
          >200+</strong
        >
        <span class="mt-2 text-sm font-bold tracking-wide text-white/75">核心专利技术</span>
      </div>
      <div class="flex flex-col items-center text-center">
        <strong
          class="text-[clamp(34px,4vw,52px)] leading-none font-black tracking-tight text-white tabular-nums"
          >200万+</strong
        >
        <span class="mt-2 text-sm font-bold tracking-wide text-white/75">连接设备</span>
      </div>
      <div class="flex flex-col items-center text-center">
        <strong
          class="text-[clamp(34px,4vw,52px)] leading-none font-black tracking-tight text-white tabular-nums"
          >150+</strong
        >
        <span class="mt-2 text-sm font-bold tracking-wide text-white/75">国家和地区</span>
      </div>
      <div class="flex flex-col items-center text-center">
        <strong
          class="text-[clamp(34px,4vw,52px)] leading-none font-black tracking-tight text-white tabular-nums"
          >10年+</strong
        >
        <span class="mt-2 text-sm font-bold tracking-wide text-white/75">行业深耕</span>
      </div>
    </div>
  </div>
</section>
