<!-- CTA 横幅 + 数据统计栏（万椿）— 高级感优化 -->
<section
  class="relative overflow-hidden py-24 sm:py-32"
  style="background: linear-gradient(145deg, #2b8d89, #4fc7b7)"
>
  <!-- 极淡网格纹理 -->
  <div
    class="pointer-events-none absolute inset-0 opacity-[0.28]"
    style="
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 16px 16px;
    "
    aria-hidden="true"
  ></div>
  <!-- 装饰性光斑 -->
  <div
    class="pointer-events-none absolute -top-32 -left-32 h-80 w-80 rounded-full bg-white/8 blur-3xl"
  ></div>
  <div
    class="bg-secondary/10 pointer-events-none absolute -right-32 -bottom-32 h-80 w-80 rounded-full blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-4xl px-4 text-center sm:px-6 lg:px-8">
    <div class="reveal flex flex-col items-center gap-8">
      <h2
        class="text-3xl leading-tight font-black tracking-tighter text-white sm:text-4xl lg:text-5xl"
      >
        共建有温度的智慧养老生态
      </h2>
      <p class="max-w-2xl text-base leading-7 font-light text-white/85 sm:text-lg sm:leading-7">
        10 年+ 深耕 · 3 大研发中心 · 200+ 核心专利，2 亿+ 智造积累，携手 150+
        国家和地区的伙伴，让科技更有温度。
      </p>

      <!-- 双按钮 -->
      <div class="flex flex-wrap items-center justify-center gap-4">
        <a th:href="@{/page/contact}" href="/page/contact" class="btn btn-white">预约演示</a>
        <a th:href="@{/archives}" href="/archives" class="btn btn-ghost">成为合作伙伴</a>
      </div>
    </div>

    <!-- 统计数字（万椿真实数据） -->
    <div class="reveal mt-14 grid grid-cols-2 gap-x-6 gap-y-8 sm:mt-16 lg:grid-cols-4">
      <div class="flex flex-col items-center gap-2 text-center">
        <span class="text-4xl font-black tracking-tighter text-white tabular-nums sm:text-5xl"
          >200+</span
        >
        <span
          class="inline-flex items-center rounded-full bg-white/15 px-4 py-1 text-sm font-light tracking-wide text-white/90 backdrop-blur-sm"
          >核心专利技术</span
        >
      </div>
      <div class="flex flex-col items-center gap-2 text-center">
        <span class="text-4xl font-black tracking-tighter text-white tabular-nums sm:text-5xl"
          >2,000,000+</span
        >
        <span
          class="inline-flex items-center rounded-full bg-white/15 px-4 py-1 text-sm font-light tracking-wide text-white/90 backdrop-blur-sm"
          >连接设备</span
        >
      </div>
      <div class="flex flex-col items-center gap-2 text-center">
        <span class="text-4xl font-black tracking-tighter text-white tabular-nums sm:text-5xl"
          >150+</span
        >
        <span
          class="inline-flex items-center rounded-full bg-white/15 px-4 py-1 text-sm font-light tracking-wide text-white/90 backdrop-blur-sm"
          >国家和地区</span
        >
      </div>
      <div class="flex flex-col items-center gap-2 text-center">
        <span class="text-4xl font-black tracking-tighter text-white tabular-nums sm:text-5xl"
          >10年+</span
        >
        <span
          class="inline-flex items-center rounded-full bg-white/15 px-4 py-1 text-sm font-light tracking-wide text-white/90 backdrop-blur-sm"
          >行业深耕</span
        >
      </div>
    </div>
  </div>
</section>
