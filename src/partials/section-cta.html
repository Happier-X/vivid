<!-- CTA 横幅：渐变背景 + 双按钮 -->
<section class="bg-white py-16 sm:py-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div
      class="from-primary to-primary-dark relative overflow-hidden rounded-[var(--radius-card)] bg-gradient-to-r px-6 py-16 text-center sm:px-16 sm:py-20"
    >
      <!-- 装饰性光斑 -->
      <div
        class="pointer-events-none absolute -top-24 -left-24 h-64 w-64 rounded-full bg-white/10 blur-3xl"
      ></div>
      <div
        class="pointer-events-none absolute -right-24 -bottom-24 h-64 w-64 rounded-full bg-white/10 blur-3xl"
      ></div>

      <div class="relative mx-auto flex max-w-2xl flex-col items-center gap-8">
        <h2
          th:text="${theme.config.cta?.title}"
          class="text-3xl font-bold tracking-tight text-white sm:text-4xl"
        >
          标题
        </h2>
        <p
          th:if="${not #strings.isEmpty(theme.config.cta?.description)}"
          th:text="${theme.config.cta.description}"
          class="text-base leading-relaxed text-white/80 sm:text-lg"
        >
          描述
        </p>

        <!-- 双按钮 -->
        <div class="flex flex-wrap items-center justify-center gap-4">
          <a
            th:if="${not #strings.isEmpty(theme.config.cta?.primary_button_text)}"
            th:href="@{${theme.config.cta.primary_button_link ?: '#'}}"
            th:text="${theme.config.cta.primary_button_text}"
            class="text-primary inline-flex items-center rounded-[var(--radius-card)] bg-white px-8 py-3.5 text-base font-semibold shadow-lg transition-all hover:bg-slate-50 hover:shadow-xl"
          >
            主按钮
          </a>
          <a
            th:if="${not #strings.isEmpty(theme.config.cta?.secondary_button_text)}"
            th:href="@{${theme.config.cta.secondary_button_link ?: '#'}}"
            th:text="${theme.config.cta.secondary_button_text}"
            class="inline-flex items-center rounded-[var(--radius-card)] border border-white/40 px-8 py-3.5 text-base font-semibold text-white transition-all hover:border-white hover:bg-white/10"
          >
            次按钮
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
