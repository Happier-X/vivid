<!-- 全局顶部导航：1:1 复刻 mikapu 的 mk-header — fixed 透明 + 滚动毛玻璃 -->
<header
  id="site-header"
  th:with="menu = ${menuFinder.getPrimary()}"
  class="fixed inset-x-0 top-0 z-50 h-[76px] border-b border-transparent bg-transparent transition-[background,box-shadow,border-color] duration-300"
>
  <div
    class="mx-auto flex h-[76px] w-[calc(100%-32px)] max-w-[1180px] items-center justify-between gap-6"
  >
    <!-- Logo：万椿品牌，样式复刻 mikapu 的排版质感 -->
    <a th:href="@{/}" href="/" class="flex items-center gap-3 no-underline" aria-label="首页">
      <img
        th:src="@{/assets/images/wanchun-logo.png}"
        src="/themes/theme-vite-starter/assets/images/wanchun-logo.png"
        alt="万椿"
        class="h-10 w-10 shrink-0 object-contain"
        onerror="this.style.display = 'none'"
      />
      <span class="flex flex-col leading-none">
        <span class="flex items-center gap-1 text-lg font-black tracking-tight">
          <span class="text-ink-900">万椿智能</span><span class="text-ink-900 font-light">·</span
          ><span style="color: #2b8d89">智慧养老</span>
        </span>
        <span class="text-ink-500/70 hidden text-[10px] tracking-widest lg:block"
          >www.wanchunsmart.com</span
        >
      </span>
    </a>

    <!-- 桌面端导航：居中胶囊悬浮，hover 时 #e0f7f4 -->
    <nav id="mk-main-nav" class="hidden items-center gap-1 md:flex" aria-label="主导航">
      <a
        th:each="item : ${menu?.menuItems}"
        th:href="@{${item.status.href}}"
        th:text="${item.status.displayName}"
        th:target="${item.spec.target?.value}"
        class="rounded-[8px] px-[14px] py-[10px] text-[14px] leading-none font-bold text-[rgba(31,45,56,0.8)] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#e0f7f4] hover:text-[#2b8d89]"
        >菜单项</a
      >
    </nav>

    <!-- 右侧操作区：万椿为企业官网，仅保留汉堡（样式复刻 mikapu） -->
    <div class="flex items-center gap-2.5">
      <button
        id="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="mobile-menu"
        class="inline-flex h-9 w-9 flex-col items-center justify-center gap-1 rounded-[8px] border border-[rgba(79,199,183,0.32)] bg-white text-[#2b8d89] md:hidden"
        aria-label="打开菜单"
      >
        <span class="block h-0.5 w-[18px] rounded-full bg-current"></span>
        <span class="block h-0.5 w-[18px] rounded-full bg-current"></span>
        <span class="block h-0.5 w-[18px] rounded-full bg-current"></span>
      </button>
    </div>
  </div>

  <!-- 移动端下拉菜单 -->
  <nav
    id="mobile-menu"
    class="hidden border-t border-[rgba(217,236,233,0.8)] bg-[rgba(251,254,254,0.96)] shadow-[0_8px_28px_rgba(31,45,56,0.07)] backdrop-blur-[18px] md:hidden"
    aria-label="移动端导航"
  >
    <ul class="space-y-1 px-4 py-3">
      <li th:each="item : ${menu?.menuItems}">
        <a
          th:href="@{${item.status.href}}"
          th:text="${item.status.displayName}"
          th:target="${item.spec.target?.value}"
          class="block rounded-[8px] px-4 py-3 text-base font-bold text-[rgba(31,45,56,0.82)] transition-colors hover:bg-[#e0f7f4] hover:text-[#2b8d89]"
          >菜单项</a
        >
      </li>
    </ul>
  </nav>
</header>
