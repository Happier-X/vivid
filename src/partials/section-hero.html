<!-- Hero 首屏：顶部标签 + 大标题 + 副标题 + 双 CTA + 特性标签 + 主图 -->
<section
  class="relative overflow-hidden"
  style="
    background-image:
      linear-gradient(
        135deg,
        rgba(79, 199, 183, 0.13),
        rgba(255, 255, 255, 0.92) 48%,
        rgba(247, 184, 200, 0.16)
      ),
      linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 216, 107, 0.08));
  "
>
  <!-- 装饰性柔和光斑 -->
  <div
    class="bg-primary/15 pointer-events-none absolute -top-32 -right-24 h-96 w-96 rounded-full blur-3xl"
  ></div>
  <div
    class="bg-secondary/20 pointer-events-none absolute -bottom-24 -left-16 h-72 w-72 rounded-full blur-3xl"
  ></div>
  <div
    class="bg-accent-pink/25 pointer-events-none absolute top-1/3 left-1/4 h-40 w-40 rounded-full blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-20 lg:px-8 lg:py-28">
    <div class="grid items-center gap-12 lg:grid-cols-2">
      <!-- 左侧文案区 -->
      <div class="reveal flex flex-col items-start gap-6">
        <!-- 顶部标签 -->
        <span
          class="border-primary/20 bg-mist text-primary-dark inline-flex items-center rounded-full border px-4 py-1.5 text-sm font-semibold"
        >
          新一代智能科技
        </span>

        <h1 class="text-ink-900 text-4xl leading-tight font-black tracking-tight sm:text-5xl">
          以科技创新，驱动企业未来
        </h1>

        <p class="text-ink-500 max-w-xl text-lg leading-relaxed">
          我们专注于为企业提供智能化产品与解决方案，让技术更好地服务于每一个人。
        </p>

        <!-- 双 CTA 按钮 -->
        <div class="flex flex-wrap items-center gap-4">
          <a th:href="@{/archives}" class="btn btn-primary"> 立即体验 </a>
          <a th:href="@{/page/about}" class="btn btn-outline"> 了解更多 </a>
        </div>

        <!-- 特性标签组 -->
        <ul class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              智能互联
            </span>
          </li>
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              极致性能
            </span>
          </li>
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              安全可靠
            </span>
          </li>
        </ul>
      </div>

      <!-- 右侧主图：外层入场滑入，内层持续浮动（避免 transform 互相覆盖） -->
      <div class="reveal reveal-right">
        <div class="animate-float relative">
          <div
            class="from-primary/15 to-accent-pink/20 absolute -inset-6 -z-10 rounded-[2rem] bg-gradient-to-tr blur-2xl"
          ></div>
          <div
            class="shadow-lift from-primary to-primary-deep flex aspect-video w-full items-center justify-center rounded-[var(--radius-card)] bg-gradient-to-br text-white"
          >
            <svg
              class="h-20 w-20 opacity-70"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M18 6h.008v.008H18V6z"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
