<!-- Hero 首屏：万椿智慧养老 — 高级感优化版 -->
<section
  class="relative overflow-hidden"
  style="
    background-image:
      linear-gradient(
        135deg,
        rgba(79, 199, 183, 0.13),
        rgba(255, 255, 255, 0.92) 48%,
        rgba(247, 184, 200, 0.16)
      ),
      linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 216, 107, 0.08));
  "
>
  <!-- 极淡网格纹理叠加（高级感） -->
  <div
    class="pointer-events-none absolute inset-0 opacity-[0.32]"
    style="
      background-image: radial-gradient(rgba(79, 199, 183, 0.06) 1px, transparent 1px);
      background-size: 16px 16px;
    "
    aria-hidden="true"
  ></div>
  <!-- 装饰性柔和光斑 -->
  <div
    class="bg-primary/15 pointer-events-none absolute -top-32 -right-24 h-96 w-96 rounded-full blur-3xl"
  ></div>
  <div
    class="bg-secondary/20 pointer-events-none absolute -bottom-24 -left-16 h-72 w-72 rounded-full blur-3xl"
  ></div>
  <div
    class="bg-accent-pink/25 pointer-events-none absolute top-1/3 left-1/4 h-40 w-40 rounded-full blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl px-4 py-28 sm:px-6 lg:px-8 lg:py-32">
    <div class="grid items-center gap-12 lg:grid-cols-2 lg:gap-16">
      <!-- 左侧文案区 -->
      <div class="reveal flex flex-col items-start gap-8">
        <!-- 顶部标签 -->
        <span
          class="border-primary/20 bg-mist text-primary-dark inline-flex items-center rounded-full border px-4 py-1.5 text-sm font-semibold tracking-wide backdrop-blur-sm"
        >
          国家高新技术企业 · 太平洋保险承保 · 椿萱并茂 棠棣同馨
        </span>

        <h1
          class="text-ink-900 text-4xl leading-[1.1] font-black tracking-tighter sm:text-5xl lg:text-[3.4rem]"
        >
          让每一位长者享有<br />
          <span class="text-primary-dark bg-primary/8 rounded-full px-2.5 py-0.5"
            >有品质、有温度</span
          >的智慧晚年
        </h1>

        <p class="text-ink-500/90 max-w-xl text-lg leading-7 font-light">
          山东万椿智能科技，深耕智慧养老 10 年+，以“设备+平台+服务”3+X
          方案与“健康监测-安全预警-生活辅助-社交陪伴”4+N 体系，融合 AI / 物联网 / 大数据 /
          云计算，为居家 · 社区 · 机构提供全场景守护。
        </p>

        <!-- 双 CTA 按钮 -->
        <div class="flex flex-wrap items-center gap-4">
          <a th:href="@{/archives}" href="/archives" class="btn btn-primary"> 探索解决方案 </a>
          <a th:href="@{/page/contact}" href="/page/contact" class="btn btn-outline"> 联系我们 </a>
        </div>

        <!-- 特性标签组 -->
        <ul class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium backdrop-blur-sm"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              毫米波无感监测
            </span>
          </li>
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium backdrop-blur-sm"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              多维安全守护
            </span>
          </li>
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium backdrop-blur-sm"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              智慧养老云平台
            </span>
          </li>
          <li>
            <span
              class="bg-mist text-primary-dark inline-flex items-center gap-2 rounded-full px-4 py-1.5 font-medium backdrop-blur-sm"
            >
              <svg
                class="text-primary h-3.5 w-3.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2.5"
                stroke="currentColor"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
              20+ 科研项目支撑
            </span>
          </li>
        </ul>
      </div>

      <!-- 右侧主图：外层入场滑入，内层持续浮动（避免 transform 互相覆盖） -->
      <div class="reveal reveal-right">
        <div class="animate-float relative">
          <div
            class="from-primary/15 to-accent-pink/20 absolute -inset-6 -z-10 rounded-[2rem] bg-gradient-to-tr blur-2xl"
          ></div>
          <!-- 万椿产品主图占位，保留渐变卡片，后续可替换为真实产品图 -->
          <div
            class="from-primary to-primary-deep relative flex aspect-video w-full items-center justify-center overflow-hidden rounded-[var(--radius-card)] bg-gradient-to-br text-white shadow-[0_20px_60px_rgba(36,109,116,0.12)]"
          >
            <svg
              class="h-20 w-20 opacity-70"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M18 6h.008v.008H18V6z"
              />
            </svg>
            <span
              class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full bg-white/15 px-4 py-1 text-xs font-semibold tracking-widest whitespace-nowrap backdrop-blur"
              >万椿智慧养老 · 感知-网络-平台-应用一体化</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
