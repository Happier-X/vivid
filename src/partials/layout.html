<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <slot name="head">
      <title th:text="${site.title}">站点标题</title>
    </slot>
    <link rel="stylesheet" href="./css/main.css" />
    <script type="module" src="./js/main.ts"></script>
    <!-- 运行时注入后台「样式」设置，覆盖设计令牌，实现配色即时生效 -->
    <style th:inline="css">
      :root {
        --color-primary: [(${theme.config.style?.primary_color ?: "#2563eb"})];
        --color-secondary: [(${theme.config.style?.secondary_color ?: "#0f172a"})];
        --radius-card: [(${theme.config.style?.radius_style == "sharp" ? "0rem": "0.75rem"})];
      }
    </style>
  </head>
  <body class="text-ink-900 bg-white font-sans antialiased">
    <include src="header.html"></include>

    <main>
      <slot />
    </main>

    <include src="footer.html"></include>
  </body>
</html>
