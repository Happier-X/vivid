<!-- 功能介绍：左文右图 + 功能点数组 -->
<section class="bg-white py-16 sm:py-24">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid items-center gap-12 lg:grid-cols-2">
      <!-- 左侧文案 -->
      <div class="flex flex-col items-start gap-6">
        <p
          th:if="${not #strings.isEmpty(theme.config.intro?.eyebrow)}"
          th:text="${theme.config.intro.eyebrow}"
          class="text-primary text-sm font-semibold tracking-widest uppercase"
        >
          小标题
        </p>
        <h2
          th:text="${theme.config.intro?.title}"
          class="text-ink-900 text-3xl font-extrabold tracking-tight sm:text-4xl"
        >
          大标题
        </h2>
        <p
          th:if="${not #strings.isEmpty(theme.config.intro?.description)}"
          th:text="${theme.config.intro.description}"
          class="text-ink-500 text-lg leading-relaxed"
        >
          描述
        </p>

        <!-- 功能点列表 -->
        <ul
          th:if="${not #lists.isEmpty(theme.config.intro?.points)}"
          class="flex w-full flex-col gap-5"
        >
          <li th:each="point : ${theme.config.intro.points}" class="flex items-start gap-4">
            <span
              class="bg-mist text-primary border-primary/15 mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full border"
            >
              <svg
                class="h-4.5 w-4.5"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"
                />
              </svg>
            </span>
            <div>
              <h3 th:text="${point.title}" class="text-ink-900 font-extrabold tracking-tight">
                功能点标题
              </h3>
              <p th:text="${point.description}" class="text-ink-500 mt-1 text-sm leading-relaxed">
                功能点描述
              </p>
            </div>
          </li>
        </ul>
      </div>

      <!-- 右侧配图 -->
      <img
        th:if="${not #strings.isEmpty(theme.config.intro?.image)}"
        th:src="${theme.config.intro.image}"
        th:alt="${theme.config.intro?.title ?: '功能介绍'}"
        loading="lazy"
        class="shadow-lift w-full rounded-[var(--radius-card)] object-cover"
      />
      <!-- 未配置配图时的占位视觉 -->
      <div
        th:unless="${not #strings.isEmpty(theme.config.intro?.image)}"
        class="from-mist to-primary/20 text-primary/50 flex aspect-[4/3] w-full items-center justify-center rounded-[var(--radius-card)] bg-gradient-to-br"
      >
        <svg
          class="h-16 w-16"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"
          />
        </svg>
      </div>
    </div>
  </div>
</section>
