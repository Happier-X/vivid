apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-vite-starter
spec:
  displayName: 万椿智慧养老
  author:
    name: 山东万椿智能科技有限公司
    website: https://www.wanchunsmart.com
  description: 山东万椿智能科技 · 国家高新技术企业 · 太平洋保险承保，以“设备+平台+服务”3+X与“健康监测-安全预警-生活辅助-社交陪伴”4+N智慧养老体系，融合AI/物联网/大数据/云计算，为居家·社区·机构提供全场景智慧守护。
  logo: /assets/images/wanchun-logo.png
  homepage: https://www.wanchunsmart.com
  repo: https://github.com/halo-dev/theme-vite-starter
  issues: https://github.com/halo-dev/theme-vite-starter/issues
  settingName: "theme-vite-starter-setting"
  configMapName: "theme-vite-starter-configMap"
  customTemplates:
    page:
      - name: 关于万椿
        description: 万椿企业介绍页，含数据/实力/认证/案例
        file: page_about.html
      - name: 合作咨询
        description: 万椿合作咨询页，含四类合作模式与表单
        file: page_cooperation.html
      - name: 解决方案
        description: 万椿全场景解决方案，3+X 与 4+N 体系
        file: page_solutions.html
  version: 1.0.2
  requires: ">=2.0.0"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/halo-dev/theme-vite-starter/blob/main/LICENSE"
